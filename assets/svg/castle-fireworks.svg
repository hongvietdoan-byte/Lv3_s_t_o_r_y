<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fw1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0d6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fw2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe1ea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2350"/>
      <stop offset="100%" stop-color="#4a3a72"/>
    </linearGradient>
  </defs>

  <!-- fireworks bursts -->
  <g>
    <circle cx="220" cy="110" r="90" fill="url(#fw1)"/>
    <g stroke="#ffe1ea" stroke-width="2" opacity="0.7">
      <line x1="220" y1="110" x2="220" y2="40"/>
      <line x1="220" y1="110" x2="280" y2="70"/>
      <line x1="220" y1="110" x2="280" y2="150"/>
      <line x1="220" y1="110" x2="220" y2="180"/>
      <line x1="220" y1="110" x2="160" y2="150"/>
      <line x1="220" y1="110" x2="160" y2="70"/>
    </g>
    <circle cx="680" cy="90" r="80" fill="url(#fw2)"/>
    <g stroke="#ffb8cd" stroke-width="2" opacity="0.7">
      <line x1="680" y1="90" x2="680" y2="30"/>
      <line x1="680" y1="90" x2="730" y2="60"/>
      <line x1="680" y1="90" x2="730" y2="120"/>
      <line x1="680" y1="90" x2="680" y2="150"/>
      <line x1="680" y1="90" x2="630" y2="120"/>
      <line x1="680" y1="90" x2="630" y2="60"/>
    </g>
  </g>

  <!-- castle silhouette -->
  <g fill="#3a2f63" opacity="0.9">
    <rect x="380" y="260" width="140" height="160" rx="4"/>
    <rect x="330" y="300" width="60" height="120"/>
    <rect x="510" y="300" width="60" height="120"/>
    <polygon points="360,300 360,240 385,270"/>
    <polygon points="540,300 540,240 515,270"/>
    <polygon points="450,260 420,190 480,190"/>
    <rect x="435" y="200" width="30" height="70"/>
    <polygon points="290,340 290,290 315,320"/>
    <rect x="270" y="340" width="45" height="80"/>
    <polygon points="610,340 610,290 585,320"/>
    <rect x="585" y="340" width="45" height="80"/>
    <rect x="440" y="330" width="20" height="90" fill="#241c40"/>
  </g>
  <g fill="#f7e2b0" opacity="0.6">
    <rect x="400" y="300" width="10" height="14"/>
    <rect x="430" y="300" width="10" height="14"/>
    <rect x="460" y="300" width="10" height="14"/>
    <rect x="490" y="300" width="10" height="14"/>
    <rect x="400" y="340" width="10" height="14"/>
    <rect x="490" y="340" width="10" height="14"/>
