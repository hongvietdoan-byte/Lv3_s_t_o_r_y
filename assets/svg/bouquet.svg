<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wrapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd9e2"/>
      <stop offset="100%" stop-color="#ec8fac"/>
    </linearGradient>
    <radialGradient id="roseGlowA" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f6b9cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlowB" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f2a0ba" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- paper wrap cone -->
  <path d="M70,220 L150,360 L230,220 Z" fill="url(#wrapGrad)"/>
  <path d="M70,220 L20,175 L115,205 Z" fill="#fbe3ea" opacity="0.9"/>
  <path d="M230,220 L280,175 L185,205 Z" fill="#f6c6d6" opacity="0.9"/>
  <path d="M115,235 L150,330 L185,235 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M90,245 L60,260 L100,270 Z" fill="#f3aec3" opacity="0.7"/>
  <path d="M210,245 L240,260 L200,270 Z" fill="#f3aec3" opacity="0.7"/>
  <!-- ribbon -->
  <path d="M88,250 L212,262" stroke="#fff" stroke-width="12" opacity="0.9"/>
  <path d="M150,248 C136,265 136,282 150,294 C164,282 164,265 150,248 Z" fill="#fff"/>

  <!-- leaves -->
  <g fill="#7fa35f">
    <ellipse cx="55" cy="170" rx="12" ry="32" transform="rotate(-32 55 170)"/>
    <ellipse cx="245" cy="170" rx="12" ry="32" transform="rotate(32 245 170)"/>
    <ellipse cx="150" cy="115" rx="11" ry="30" transform="rotate(4 150 115)"/>
    <ellipse cx="95" cy="140" rx="9" ry="24" transform="rotate(-14 95 140)"/>
    <ellipse cx="205" cy="140" rx="9" ry="24" transform="rotate(14 205 140)"/>
  </g>

  <!-- rose heads (large, front row) -->
  <g transform="translate(102,178)">
    <g fill="#f2a0ba">
      <ellipse cx="0" cy="-30" rx="13" ry="17" transform="rotate(0)"/>
      <ellipse cx="24" cy="-16" rx="13" ry="17" transform="rotate(60)"/>
      <ellipse cx="24" cy="16" rx="13" ry="17" transform="rotate(120)"/>
      <ellipse cx="0" cy="30" rx="13" ry="17" transform="rotate(180)"/>
      <ellipse cx="-24" cy="16" rx="13" ry="17" transform="rotate(240)"/>
      <ellipse cx="-24" cy="-16" rx="13" ry="17" transform="rotate(300)"/>
    </g>
    <circle r="26" fill="#f6b9cc"/>
    <circle r="17" fill="#fbd9e2"/>
    <circle r="8" fill="#fff0f4"/>
    <circle r="30" fill="url(#roseGlowA)"/>
  </g>
  <g transform="translate(198,178)">
    <g fill="#e8809e">
      <ellipse cx="0" cy="-30" rx="13" ry="17"/>
      <ellipse cx="24" cy="-16" rx="13" ry="17" transform="rotate(60)"/>
      <ellipse cx="24" cy="16" rx="13" ry="17" transform="rotate(120)"/>
      <ellipse cx="0" cy="30" rx="13" ry="17" transform="rotate(180)"/>
      <ellipse cx="-24" cy="16" rx="13" ry="17" transform="rotate(240)"/>
      <ellipse cx="-24" cy="-16" rx="13" ry="17" transform="rotate(300)"/>
    </g>
    <circle r="26" fill="#f2a0ba"/>
    <circle r="17" fill="#f6b9cc"/>
    <circle r="8" fill="#fbd9e2"/>
    <circle r="30" fill="url(#roseGlowB)"/>
  </g>
  <g transform="translate(150,120)">
    <g fill="#fce7ec">
      <ellipse cx="0" cy="-34" rx="15" ry="19"/>
      <ellipse cx="27" cy="-18" rx="15" ry="19" transform="rotate(60)"/>
      <ellipse cx="27" cy="18" rx="15" ry="19" transform="rotate(120)"/>
      <ellipse cx="0" cy="34" rx="15" ry="19" transform="rotate(180)"/>
      <ellipse cx="-27" cy="18" rx="15" ry="19" transform="rotate(240)"/>
      <ellipse cx="-27" cy="-18" rx="15" ry="19" transform="rotate(300)"/>
    </g>
    <circle r="30" fill="#ffffff"/>
    <circle r="20" fill="#fef6f8"/>
    <circle r="9" fill="#fde3ea"/>
    <circle r="34" fill="url(#roseGlowA)"/>
  </g>

  <!-- accent blooms -->
  <g transform="translate(68,128)">
    <circle r="20" fill="#fbe3ea"/>
    <circle r="12" fill="#ffffff"/>
    <circle r="5" fill="#f6b9cc"/>
  </g>
  <g transform="translate(232,132)">
    <circle r="20" fill="#f6b9cc"/>
    <circle r="12" fill="#fbd9e2"/>
    <circle r="5" fill="#fff0f4"/>
  </g>
  <g transform="translate(120,155)">
    <circle r="14" fill="#ffe3ea"/>
    <circle r="7" fill="#fff8fa"/>
  </g>
  <g transform="translate(182,155)">
    <circle r="14" fill="#f7cdd6"/>
    <circle r="7" fill="#ffe3ea"/>
  </g>

  <!-- baby's breath filler -->
  <g fill="#fff7ea">
    <circle cx="128" cy="82" r="6"/><circle cx="172" cy="84" r="6"/><circle cx="150" cy="65" r="6.5"/>
    <circle cx="80" cy="95" r="5"/><circle cx="222" cy="98" r="5"/>
    <circle cx="105" cy="70" r="4"/><circle cx="196" cy="72" r="4"/>
  </g>
</svg>
